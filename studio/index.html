<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3a2414">
<meta name="format-detection" content="telephone=no">
<title>The Drafting Room · Adventure Game Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true">✒</span><div><b>The Drafting Room</b><small id="proj-title"></small></div></div>
  <button id="pill" class="pill checking" type="button" aria-live="polite"><span class="dot"></span><span id="pill-text">Checking…</span></button>
  <div class="tools">
    <button id="btn-undo" class="icon" type="button" title="Undo" aria-label="Undo">↶</button>
    <button id="btn-redo" class="icon" type="button" title="Redo" aria-label="Redo">↷</button>
    <button id="btn-menu" class="icon" type="button" title="Versions, samples & settings" aria-label="Versions, samples and settings">☰</button>
  </div>
  <nav id="steps" class="steps" aria-label="Steps"></nav>
</header>
<main id="view" tabindex="-1"><div class="card paper loading">Unrolling the plans…</div></main>
<footer id="wizard-nav" class="wizard-nav"></footer>
<button id="fab" class="fab" type="button">✎ <span>Co-writer</span></button>

<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" hidden role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></section>
<aside id="cowriter" class="sheet cowriter" hidden role="dialog" aria-label="Co-writer"><div class="grab"></div><div id="cw-body"></div></aside>
<div id="toast" class="toast" hidden></div>
<script>
  // never a blank page: show script errors on screen (phones have no console)
  window.addEventListener('error', function (e) {
    if (window.STUDIO_READY) return;
    var v = document.getElementById('view');
    if (v) v.innerHTML = '<div class="card breakbox"><b>The Studio hit a snag while loading.</b><p>' + String(e.message || e).replace(/</g, '&lt;') + '</p><p><a href="?reset=1">Start fresh</a></p></div>';
  });
</script>
<script>window.STUDIO_ROOT = '';</script>
<script src="js/paths.js"></script>
<script src="js/jsonpatch.js"></script>
<script src="engine/core.js"></script>
<script src="js/validate.js"></script>
<script src="js/edits.js"></script>
<script src="js/cowriter.js"></script>
<script src="js/organizer.js"></script>
<script src="js/newgame.js"></script>
<script src="js/seed.js"></script>
<script src="js/app.js"></script>
</body>
</html>
